events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    keepalive_timeout 65;

    # Upstream PocketBase
    upstream pocketbase {
        server pocketbase:8090;
    }

    server {
        listen 80;
        server_name _;

        # PocketBase Admin UI - MUST be before generic locations
        location /_/ {
            proxy_pass http://pocketbase/_/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # PocketBase API
        location /api/ {
            proxy_pass http://pocketbase/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_cache off;
        }

        # PocketBase static files (if any)
        location /pb_static/ {
            proxy_pass http://pocketbase/pb_static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback: Proxy everything else to your frontend
        location / {
            # If you have a separate frontend service, proxy to it here
            # For now, try proxying to pocketbase as fallback
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
