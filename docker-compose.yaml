version: "3.8"

services:
  nginx:
    build: .
    container_name: tvtracker-nginx
    # Notice the "ports:" block has been completely removed here
    restart: unless-stopped
    depends_on:
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: tvtracker-pb
    volumes:
      - pb_data:/pb_data
    environment:
      - PB_ENCRYPTION_KEY=your-32-char-random-string-123
    restart: unless-stopped

volumes:
  pb_data:
