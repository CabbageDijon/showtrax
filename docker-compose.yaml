version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tvtracker-nginx
    restart: unless-stopped
    depends_on:
      - pocketbase
    networks:
      - coolify

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: tvtracker-pb
    volumes:
      - ./pb_data:/pb_data
    environment:
      - PB_ENCRYPTION_KEY=your-32-char-random-string-123
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true
