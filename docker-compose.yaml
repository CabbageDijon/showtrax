version: "3.8"

services:
  nginx:
    build: .
    container_name: tvtracker-nginx
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: tvtracker-pb
    volumes:
      - pb_data:/pb_data               # <--- Removed the ./
    environment:
      - PB_ENCRYPTION_KEY=your-32-char-random-string-123
    restart: unless-stopped

# Tell Docker to create a persistent named volume
volumes:
  pb_data:                             # <--- Added this block
